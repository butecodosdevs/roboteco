name: roboteco

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-roboteco}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-roboteco}
  S3_ENDPOINT: http://garage:3900
  VALKEY_URL: redis://valkey:6379

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roboteco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-roboteco}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  garage:
    image: dxflrs/garage:v2.6.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.2.1-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional virus scanning for the safety module: set COMPOSE_PROFILES=clamav and CLAMAV_HOST=clamav.
  clamav:
    image: clamav/clamav:1.5.5
    profiles: ["clamav"]
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m

  migrate:
    image: roboteco:${ROBOTECO_VERSION:-latest}
    build: .
    command: ["node", "--enable-source-maps", "dist/db/migrate.js"]
    env_file: .env
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  deploy-commands:
    image: roboteco:${ROBOTECO_VERSION:-latest}
    command: ["node", "--enable-source-maps", "dist/deploy-commands.js"]
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  bot:
    image: roboteco:${ROBOTECO_VERSION:-latest}
    env_file: .env
    environment:
      <<: *app-env
      HEALTH_PORT: "3000"
      # Only reachable through the host, never from the network: a session cookie must not travel
      # over plain HTTP. Put nginx/Caddy in front for TLS; the published port below is loopback.
      PANEL_HOST: "0.0.0.0"
      # Lets the Settings tab restart the container after saving a writable setting.
      ROBOTECO_RESTART: docker
    ports:
      - "127.0.0.1:${HEALTH_PUBLISH_PORT:-3000}:3000"
    volumes:
      # Uploads and settings live outside the image, so a redeploy keeps them.
      - ./panel:/app/panel
      - ./plugins:/app/plugins
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-roboteco}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-roboteco}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  clamav-data:
