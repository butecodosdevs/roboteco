<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roboteco</title>
<link rel="stylesheet" href="/panel.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark" id="brandmark"></div>
      <div class="txt"><b>roboteco</b><span id="foot-tag">painel</span></div>
    </div>
    <nav class="nav" id="nav">
      <i>Servidor</i>
      <a data-go="overview"><span class="ic"></span>Visão geral</a>
      <i>Plataforma</i>
      <a data-go="plugins"><span class="ic"></span>Plugins<span class="count" id="nav-plugins">0</span></a>
      <a data-go="commands"><span class="ic"></span>Embutidos<span class="count" id="nav-commands">0</span></a>
      <a data-go="settings"><span class="ic"></span>Configurações</a>
      <a data-go="about"><span class="ic"></span>Como funciona</a>
    </nav>
    <div class="foot">
      <div class="row"><span style="display:inline-flex;align-items:center;gap:6px"><i class="dot"></i>Gateway</span><b id="foot-ping">—</b></div>
      <div class="row"><span>Servidores</span><b id="foot-guilds">—</b></div>
      <div class="row"><span>Plugins ativos</span><b id="foot-active">0</b></div>
      <button class="foot-out" data-act="logout"><span class="ic"></span>Sair</button>
    </div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div class="toast" id="toast"></div>
<script>
const ICON = {
  overview: '<circle cx="8" cy="8" r="5.9"/><path d="M8 4.9v3.3l2 1.3"/>',
  plugins: '<path d="M6 2.6v2.1a1.4 1.4 0 0 1-1.4 1.4H2.6v4.4h2a1.4 1.4 0 0 1 1.4 1.4v1.5h4.4v-1.5a1.4 1.4 0 0 1 1.4-1.4h2V6.1h-2A1.4 1.4 0 0 0 10.4 4.7V2.6z"/>',
  commands: '<path d="M5.6 4.4 2.8 8l2.8 3.6M10.4 4.4 13.2 8l-2.8 3.6"/>',
  settings: '<circle cx="8" cy="8" r="2.1"/><path d="M8 2.2v1.4M8 12.4v1.4M2.2 8h1.4M12.4 8h1.4M3.9 3.9l1 1M11.1 11.1l1 1M12.1 3.9l-1 1M4.9 11.1l-1 1"/>',
  about: '<circle cx="8" cy="8" r="5.9"/><path d="M8 7.2v3.4M8 5.3v.3"/>',
  sun: '<circle cx="8" cy="8" r="2.8"/><path d="M8 1.8v1M8 13.2v1M1.8 8h1M13.2 8h1M3.7 3.7l.7.7M11.6 11.6l.7.7M12.3 3.7l-.7.7M4.4 11.6l-.7.7"/>',
  moon: '<path d="M9.4 2.5a5.4 5.4 0 1 0 4.1 8 4.4 4.4 0 0 1-4.1-8Z"/>',
  check: '<path d="m3.2 8.3 2.9 2.9 6.7-6.7"/>',
  out: '<path d="M6.4 4.6V3.2H2.8v9.6h3.6v-1.4M9.4 5.6 11.8 8l-2.4 2.4M11.4 8H6.2"/>',
  brand: '<path d="M3.5 3.5h9v9h-9z"/><path d="M6.3 6.3h3.4v3.4H6.3z"/>',
};
const icon = (n, s = 14) => `<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ""}</svg>`;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = (name) => {
  const words = (name || "?").trim().split(/[\s-]+/).filter(Boolean);
  return (words.length > 1 ? words.slice(0, 2).map((w) => w[0]) : [words[0]?.slice(0, 2) ?? "?"]).join("").toUpperCase();
};
const nf = (n) => Number(n ?? 0).toLocaleString("pt-BR");
const plural = (n, one, many) => `${nf(n)} ${n === 1 ? one : many}`;
// Discord's cache knows the name; the id is only a fallback for someone who left.
const userCell = (name, id) => name
  ? `${esc(name)}<span class="mono dim" style="margin-left:6px">${esc(id.slice(-4))}</span>`
  : `<span class="mono dim">${esc(id)}</span>`;
const when = (iso) => { const d = new Date(iso); return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")} ${d.toTimeString().slice(0, 5)}`; };

const storedTheme = (() => { try { return localStorage.getItem("theme") || ""; } catch { return ""; } })();
if (storedTheme) document.documentElement.dataset.theme = storedTheme;
const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";

let state = { view: "overview", guild: null, toastT: null, login: false, password: false, off: false };
let meta = null;
let data = null;
let plugins = null;
let pluginError = null;
let builtins = null;
let usage = null;
let settings = null;

function toast(msg, bad) {
  const t = $("#toast");
  t.innerHTML = `<span class="${bad ? "r" : "g"}">${icon(bad ? "about" : "check", 13)}</span>${esc(msg)}`;
  t.className = `toast on${bad ? " bad" : ""}`;
  clearTimeout(state.toastT);
  state.toastT = setTimeout(() => (t.className = "toast"), 3200);
}

async function api(path, init) {
  const res = await fetch(path, {
    method: init?.method ?? "GET",
    credentials: "same-origin",
    headers: { ...(init?.body !== undefined && { "content-type": "application/json" }) },
    ...(init?.body !== undefined && { body: JSON.stringify(init.body) }),
  });
  const payload = await res.json().catch(() => null);
  if (res.status === 401) { showLogin(); throw new Error("sessão expirada; entre de novo"); }
  if (!res.ok) throw new Error(payload?.error ?? (res.status === 503 ? "painel desligado" : `HTTP ${res.status}`));
  return payload;
}

const sk = (w, h = 10, r = 4) => `<span class="sk" style="width:${w};height:${h}px;border-radius:${r}px"></span>`;
const skHead = () => `<div class="head"><div class="txt">
  <div style="margin-bottom:7px">${sk("64px", 9)}</div>
  ${sk("210px", 21, 6)}
  <div style="margin-top:10px">${sk("min(420px, 62%)", 11)}</div>
</div><div class="actions">${sk("112px", 28, 6)}</div></div>`;
const skMetrics = (n = 4) => `<div class="metrics">${Array.from({ length: n }, () => `<div class="metric">
  ${sk("76px", 9)}<div style="margin-top:9px">${sk("88px", 20, 5)}</div><div style="margin-top:8px">${sk("128px", 9)}</div>
</div>`).join("")}</div>`;
const skCardH = (w = 118) => `<div class="sk-h">${sk(w + "px", 11)}${sk("46px", 9)}</div>`;
const skRow = () => `<div class="sk-row">
  <span class="sk" style="width:29px;height:29px;border-radius:6px"></span>
  <div class="sk-lines" style="flex:1">${sk("116px", 11)}${sk("212px", 9)}</div>${sk("64px", 9)}
</div>`;
const skList = (n = 5) => `<section class="card">${skCardH()}<div>${Array.from({ length: n }, skRow).join("")}</div></section>`;
const skTable = (rows = 5) => `<section class="card tblwrap"><div class="sk-row" style="padding:9px 16px;border-top:0">
  ${sk("64px", 9)}${sk("52px", 9)}${sk("44px", 9)}<div style="flex:1"></div>${sk("40px", 9)}
</div>${Array.from({ length: rows }, () => `<div class="sk-row" style="padding:10px 16px">
  <span class="sk" style="width:27px;height:27px;border-radius:5px"></span>
  <div class="sk-lines" style="flex:1">${sk("108px", 11)}${sk("154px", 9)}</div>${sk("52px", 9)}${sk("40px", 9)}
</div>`).join("")}</section>`;

function skeletonFor(v) {
  if (v === "overview") return skHead() + skMetrics() + `<div class="cols"><div class="stack">${skList(4)}${skList(3)}</div><div class="stack">${skList(3)}${skList(2)}${skList(2)}</div></div>`;
  if (v === "plugins" || v === "commands") return skHead() + `<div class="stack">${skCardH("220px")}${skCardH("180px")}</div>`;
  if (v === "settings") return skHead() + `<div class="stack">${skTable(5)}${skList(2)}</div>`;
  return skHead() + `<div class="cols"><div class="stack">${skList(4)}</div><div class="stack">${skList(3)}</div></div>`;
}

const shell = (head, body) => `<div class="topbar">${guildPicker()}<div class="sp"></div>
  <button class="iconbtn" data-act="theme" title="Alternar aparência">${icon(isDark() ? "sun" : "moon", 15)}</button>
  <div class="me"><div class="av">${meta?.bot?.avatar ? `<img src="${esc(meta.bot.avatar)}" alt="">` : ""}</div>${esc(meta?.bot?.tag ?? "—")}</div>
</div><div class="fade">${head}${body}</div>`;

function guildPicker() {
  const list = meta?.guilds ?? [];
  const g = list.find((x) => x.id === state.guild) ?? list[0];
  if (!g) return `<div class="guild"><div class="av">?</div>sem servidor</div>`;
  return `<div class="guild"><div class="av">${g.icon ? `<img src="${esc(g.icon)}" alt="">` : esc(initials(g.name))}</div>${esc(g.name)}<em>${nf(g.members)}</em></div>`;
}

function pageHead(title, lede, actions, eyebrow) {
  return `<div class="head"><div class="txt">
    ${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ""}
    <h1>${esc(title)}</h1>
    ${lede ? `<p class="lede">${lede}</p>` : ""}
  </div>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;
}

const c = () => data?.counters ?? {};
const emptyRow = (msg) => `<div class="empty">${esc(msg)}</div>`;
const actionLabel = { warn: "Advertência", timeout: "Castigo", untimeout: "Fim do castigo", kick: "Expulsão", ban: "Banimento", unban: "Desbanimento" };
const actionCls = { warn: "warn", timeout: "warn", untimeout: "", kick: "err", ban: "err", unban: "" };

function viewOverview() {
  const k = c();
  const head = pageHead("Visão geral", "O que o bot guardou neste servidor. Tudo aqui vem de um SELECT no Postgres — nada é estimado.");

  const metrics = `<div class="metrics">
    <div class="metric"><div class="lbl">Casos de moderação</div><div class="val">${nf(k.cases)}</div><div class="delta">Numeração contínua por servidor</div></div>
    <div class="metric"><div class="lbl">Tickets abertos</div><div class="val">${nf(k.openTickets)}</div><div class="delta">${plural(k.openReports, "denúncia aberta", "denúncias abertas")}</div></div>
    <div class="metric"><div class="lbl">Sugestões pendentes</div><div class="val">${nf(k.pendingSuggestions)}</div><div class="delta">${plural(k.liveGiveaways, "sorteio rolando", "sorteios rolando")}</div></div>
    <div class="metric"><div class="lbl">Feeds com falha</div><div class="val">${nf(k.failingFeeds)}<small> de ${nf(k.feeds)}</small></div><div class="delta">${k.feeds ? (k.failingFeeds ? "Última checagem falhou" : "Todos respondendo") : "Nenhum feed assinado"}</div></div>
  </div>`;

  const cases = `<section class="card tblwrap">
    <div class="card-h"><h2>Últimos casos</h2><span class="sub">${plural(k.cases, "caso", "casos")}</span></div>
    ${caseTable(data?.cases ?? [], 6)}
  </section>`;

  const activity = `<section class="card">
    <div class="card-h"><h2>Quem mais conversa</h2><span class="sub">${plural(k.leveledMembers, "membro com XP", "membros com XP")}</span></div>
    <div class="rows">${(data?.leaders ?? []).map((l, i) => `<div class="row-item">
      <div class="tile">${i + 1}</div>
      <div class="row-main"><div class="name">${esc(l.name ?? l.userId)}</div><div class="meta">nível ${nf(l.level)}</div></div>
      <div class="row-end"><span class="num">${nf(l.xp)}<span> XP</span></span></div>
    </div>`).join("") || emptyRow("Ninguém ganhou XP ainda.")}</div>
  </section>`;

  const by = (data?.byAction ?? []).map((r) => ({ action: r.action, total: Number(r.total) }));
  const byMax = Math.max(1, ...by.map((r) => r.total));
  const split = `<section class="card pad">
    <div class="sec-title">Casos por tipo</div>
    <div class="bars-list">${by.length ? by.map((r) => `<div class="b">
      <span class="nm">${esc(actionLabel[r.action] ?? r.action)}</span><span class="v">${nf(r.total)}</span>
      <div class="track"><i style="width:${((r.total / byMax) * 100).toFixed(1)}%"></i></div>
    </div>`).join("") : `<div class="hint">Nenhum caso aplicado ainda.</div>`}</div>
  </section>`;

  const stored = [
    ["Comandos próprios", k.commands],
    ["Cargos por reação", k.selfRoles],
    ["Aniversários", k.birthdays],
    ["Convites rastreados", k.invites],
    ["Posts agendados", k.scheduledPosts],
    ["Mensagens no starboard", k.starboardEntries],
  ].filter(([, v]) => Number(v) > 0);
  const modules = `<section class="card">
    <div class="card-h"><h2>O que está guardado</h2><span class="sub">${plural(stored.length, "módulo com dados", "módulos com dados")}</span></div>
    <div class="rows">${stored.map(([nm, v]) => `<div class="row-item">
      <div class="row-main"><div class="name">${esc(nm)}</div></div>
      <div class="row-end"><span class="num">${nf(v)}</span></div>
    </div>`).join("") || emptyRow("Nada além de moderação e níveis por enquanto.")}</div>
  </section>`;

  const feeds = `<section class="card">
    <div class="card-h"><h2>Feeds</h2><span class="sub">${plural(k.failingFeeds, "falhando", "falhando")}</span></div>
    <div class="rows">${(data?.feeds ?? []).map((f) => `<div class="row-item">
      <div class="row-main"><div class="name">${esc(f.title)}</div><div class="meta cell-clip" title="${esc(f.url)}">${esc(f.url)}</div></div>
      <div class="row-end"><span class="num" style="color:${f.failures ? "var(--red)" : "var(--text-3)"}">${nf(f.failures)}<span> falhas</span></span></div>
    </div>`).join("") || emptyRow("Nenhum feed assinado.")}</div>
  </section>`;

  const channels = [
    ...(data?.drops ?? []).map((d) => ({
      k: "Drop",
      name: `a cada ${nf(d.every)} mensagens no <span class="mono">${esc(d.channelId)}</span>`,
      v: `${nf(d.xp)} XP`,
    })),
    ...(data?.hubs ?? []).map((h) => ({
      k: "Voz temporária",
      name: `hub <span class="mono">${esc(h.channelId)}</span>, limite ${h.userLimit || "livre"}${h.emptyTimeoutSeconds ? `, fecha vazio em ${h.emptyTimeoutSeconds}s` : ""}`,
      v: "",
    })),
    ...(data?.counting
      ? [{ k: "Contador", name: `canal <span class="mono">${esc(data.counting.channelId)}</span>, recorde ${nf(data.counting.record)}`, v: `${nf(data.counting.current)} atual` }]
      : []),
  ];
  const special = `<section class="card">
    <div class="card-h"><h2>Canais configurados</h2></div>
    <div class="rows">${channels.map((ch) => `<div class="row-item">
      <div class="row-main"><div class="name">${ch.k}</div><div class="meta">${ch.name}</div></div>
      ${ch.v ? `<div class="row-end"><span class="num">${ch.v}</span></div>` : ""}
    </div>`).join("") || emptyRow("Nenhum canal especial configurado.")}</div>
  </section>`;

  const left = `<div class="stack">${cases}${split}</div>`;
  const right = `<div class="stack">${activity}${modules}${feeds}${special}</div>`;
  return shell(head, metrics + `<div class="cols" style="margin-top:12px">${left}${right}</div>`);
}

function caseTable(cases, limit) {
  const rows = limit ? cases.slice(0, limit) : cases;
  if (!rows.length) return emptyRow("Nenhum caso registrado neste servidor.");
  return `<div class="tblwrap"><table>
    <thead><tr><th>#</th><th>Ação</th><th>Alvo</th><th>Quem aplicou</th><th>Motivo</th><th class="r">Quando</th></tr></thead>
    <tbody>${rows.map((r) => `<tr>
      <td class="mono dim">${r.number}</td>
      <td><span class="tag ${actionCls[r.action] ?? ""}">${esc(actionLabel[r.action] ?? r.action)}</span></td>
      <td>${userCell(r.targetName, r.targetId)}</td>
      <td class="dim">${userCell(r.moderatorName, r.moderatorId)}</td>
      <td class="muted cell-clip" title="${esc(r.reason ?? "")}">${esc(r.reason ?? "sem motivo")}</td>
      <td class="r dim num">${when(r.createdAt)}</td>
    </tr>`).join("")}</tbody>
  </table></div>`;
}

const PERMISSIONS = [
  ["kv", "guardar chaves por servidor"],
  ["xp.grant", "dar XP a um membro"],
  ["http", "fazer requisições para hosts liberados"],
];

const permTag = (p) => `<span class="tag code" title="${PERMISSIONS.find(([n]) => n === p)?.[1] ?? ""}">${esc(p)}</span>`;

function pluginStatus(p) {
  if (!p.enabled) return `<span class="stat"><i class="dot"></i>inativo</span>`;
  if (!p.present) return `<span class="stat warn"><i class="dot"></i>sem WASM</span>`;
  if (p.failure) return `<span class="stat err"><i class="dot"></i>falhou ao carregar</span>`;
  if (p.loaded) return `<span class="stat ok"><i class="dot"></i>carregado</span>`;
  return `<span class="stat warn"><i class="dot"></i>não carregado</span>`;
}

const cmdToggle = (cmd, scope) => `<button class="sw${cmd.disabled ? "" : " on"}" role="switch" aria-checked="${cmd.disabled ? "false" : "true"}" data-act="cmd-toggle" data-scope="${esc(scope)}" data-cmd="${esc(cmd.code)}" data-next="${cmd.disabled ? "1" : "0"}" title="${cmd.disabled ? "ligar" : "desligar"}"><i></i></button>`;

const cmdRow = (cmd, scope) => `<li class="${cmd.disabled ? "off" : ""}">
  <span class="mono name">/${esc(cmd.name)}</span>
  <span class="desc" title="${esc(cmd.description)}">${esc(cmd.description)}</span>
  <span class="uses" title="${plural(cmd.uses, "uso nos últimos 30 dias", "usos nos últimos 30 dias")}">${nf(cmd.uses)}</span>
  ${cmdToggle(cmd, scope)}
</li>`;

function sparkline(series, height = 44) {
  if (!series.length) return "";
  const max = Math.max(1, ...series.map((d) => d.total));
  const w = 100 / series.length;
  return `<div class="spark" style="height:${height}px" role="img" aria-label="usos por dia">${series
    .map((d, i) => `<i style="left:${(i * w).toFixed(3)}%;width:${w.toFixed(3)}%;height:${Math.max(2, (d.total / max) * 100).toFixed(1)}%" title="${esc(d.day)}: ${nf(d.total)}"><span>${nf(d.total)}</span></i>`)
    .join("")}</div>`;
}

function usageCard(usage) {
  if (!usage) return "";
  const top = usage.commands.slice(0, 8);
  const max = Math.max(1, ...top.map((r) => r.total));
  return `<section class="card pad" style="margin-bottom:12px">
    <div class="usage-head">
      <div>
        <div class="sec-title" style="margin-bottom:2px">Uso de comandos</div>
        <div class="hint" style="margin:0">${plural(usage.total, "execução", "execuções")} por ${plural(usage.members, "membro", "membros")} nos últimos 30 dias</div>
      </div>
      ${sparkline(usage.series)}
    </div>
    ${top.length ? `<div class="bars-list" style="margin-top:14px">${top.map((r) => `<div class="b">
      <span class="nm mono">/${esc(r.command)}</span><span class="v">${nf(r.total)}</span>
      <div class="track"><i style="width:${((r.total / max) * 100).toFixed(1)}%"></i></div>
    </div>`).join("")}</div>` : `<div class="hint" style="margin-top:10px">Nenhum comando rodou ainda. O gráfico começa a encher no primeiro uso.</div>`}
  </section>`;
}

function pluginCard(p) {
  const missing = p.required.filter((r) => !p.permissions.includes(r));
  const off = p.commands.filter((c) => c.disabled).length;
  return `<section class="card plug" data-plugin="${esc(p.id)}">
  <div class="plug-head">
    <div class="tile">${esc(initials(p.id.replace(/-/g, " ")))}</div>
    <div class="plug-title">
      <div class="nm">${esc(p.id)}${p.version ? `<span class="ver">${esc(p.version)}</span>` : ""}</div>
      <div class="path mono">${esc(p.wasm)}${p.source ? ` · fonte em ${esc(p.source.dir)}` : ""}</div>
    </div>
    ${pluginStatus(p)}
    <div class="plug-actions">
      <span class="tag code" title="usos nos últimos 30 dias">${nf(p.uses)} usos</span>
      ${off ? `<span class="tag">${off} desligado${off > 1 ? "s" : ""}</span>` : ""}
      <button class="btn sm" data-act="plugin-deploy" data-id="${esc(p.id)}" ${p.loaded ? "" : `disabled title="o plugin não está carregado"`}>Publicar</button>
      <button class="btn sm" data-act="plugin-toggle" data-id="${esc(p.id)}" data-next="${p.enabled ? "0" : "1"}">${p.enabled ? "Inativar" : "Ativar"}</button>
    </div>
  </div>
  ${p.failure && p.enabled ? `<div class="attn"><span class="stat err">erro</span><div class="txt mono">${esc(p.failure)}</div></div>` : ""}
  <div class="plug-sec">
    <div class="sec">Comandos${p.autocompletes ? ' <span class="tag">autocomplete</span>' : ""}</div>
    ${p.commands.length ? `<ul class="cmds">${p.commands.map((cmd) => cmdRow(cmd, p.id)).join("")}</ul>` : `<div class="hint">nenhum comando — ${p.enabled ? "o plugin não carregou, então nada foi publicado" : "o plugin está inativo"}</div>`}
  </div>
  <div class="plug-sec">
    <div class="sec">Permissões que o WASM pede</div>
    <div class="chips">${p.required.length ? p.required.map(permTag).join("") : `<span class="hint">só as funções base</span>`}</div>
    ${missing.length ? `<div class="callout amber">faltam ${missing.map(permTag).join(" ")} — o plugin não carrega assim</div>` : ""}
    <div class="perms">${PERMISSIONS.map(([name, description]) => `<label class="cap-row">
      <input type="checkbox" data-act="plugin-perm" data-id="${esc(p.id)}" data-perm="${name}" ${p.permissions.includes(name) ? "checked" : ""}>
      <span class="nm mono">${name}</span>
      <span class="ds">${description}</span>
    </label>`).join("")}</div>

}

function paintHead() {
  $("#brandmark").innerHTML = icon("brand", 13);
  $$(".nav a").forEach((b) => {
    b.classList.toggle("on", b.dataset.go === state.view);
    const ico = b.querySelector(".ic");
    if (ico && !ico.childElementCount) ico.innerHTML = icon(b.dataset.go, 13);
  });

  if (out && !out.childElementCount) out.innerHTML = icon("out", 13);
  $("#nav-plugins").textContent = nf(plugins?.length ?? meta?.plugins?.length ?? 0);
  $("#nav-commands").textContent = nf((builtins ?? []).reduce((n, g) => n + g.commands.length, 0));
  $("#foot-guilds").textContent = nf(meta?.guilds?.length ?? 0);
  $("#foot-ping").textContent = meta?.ping == null ? "—" : `${meta.ping} ms`;
  $("#foot-active").textContent = nf((plugins ?? []).filter((p) => p.loaded).length);
}

function render() {
  const v = state.view;
  if (v === "plugins" && plugins === null) { loadPlugins().then(render); return; }
  if (v === "commands" && builtins === null) { loadBuiltins(); return; }
  if (v === "settings" && settings === null) { loadSettings().then(render); return; }
  let html;
  if (v === "plugins") html = viewPlugins();
  else if (v === "commands") html = viewCommands();
  else if (v === "settings") html = viewSettings();
  else if (v === "about") html = viewAbout();
  else html = viewOverview();
  $("#view").innerHTML = html;
  paintHead();
}

let navToken = 0;
function navigate(next) {
  const tokenId = ++navToken;
  state.view = next;
  $("#view").innerHTML = skeletonFor(next);
  paintHead();
  $("main").scrollTop = 0;
  setTimeout(() => { if (tokenId === navToken) render(); }, 320);
}

function showLogin(message) {
  meta = null; data = null; plugins = null; builtins = null; settings = null;
  const first = !state.login;
  $("#view").innerHTML = `<div class="auth"><form id="auth-form" class="auth-card">
    <div class="auth-mark">${icon("brand", 16)}</div>
    <h1>Painel do roboteco</h1>
    <p>${esc(message || (first ? "Primeiro acesso: a senha é o PANEL_TOKEN do ambiente do bot." : "Entre com a senha do painel."))}</p>
    <input type="text" autocomplete="username" value="painel" hidden>
    <input id="auth-password" type="password" autocomplete="current-password" placeholder="senha" autofocus required>
    <button class="btn pri" type="submit">Entrar</button>
    <p class="hint">${state.off ? "Sem <span class='mono'>PANEL_TOKEN</span> (16+ caracteres) no ambiente do bot o painel não abre." : state.password ? "A senha fica em <span class='mono'>panel/auth.json</span> como hash scrypt, e a sessão dura 12 horas." : "Depois de entrar, troque a senha em Configurações: o PANEL_TOKEN deixa de servir como senha."}</p>
  </form></div>`;
  document.body.classList.add("auth-mode");
}

const clearAuthMode = () => document.body.classList.remove("auth-mode");

async function boot() {
  let status = null;
  try {
    status = await api("/api/panel/auth/status");
  } catch (err) {
    state.off = err.message === "painel desligado";
    return showLogin(state.off ? "O painel está desligado neste processo." : `Não consegui falar com o bot: ${err.message}`);
  }
  state.login = Boolean(status.password);
  state.password = Boolean(status.password);
  if (!status.authenticated) return showLogin();
  try {
    meta = await api("/api/panel/guilds");
  } catch (err) {
    return showLogin(`Não consegui falar com o bot: ${err.message}`);
  }
  state.guild = meta.guilds[0]?.id ?? null;
  if (!state.guild) {
    $("#view").innerHTML = shell(pageHead("Sem servidores", "O bot está no ar mas não entrou em nenhum servidor ainda."), "");
    clearAuthMode();
    paintHead();
    return;
  }
  await loadGuild();
  clearAuthMode();
  render();
}

async function loadGuild() {
  data = await api(`/api/panel?guild=${encodeURIComponent(state.guild)}`);
}

async function pluginAction(act) {
  const id = act.dataset.id;
  const button = act;
  const busy = (label) => { button.disabled = true; button.textContent = label; };
  try {
    if (act.dataset.act === "plugins-refresh" || act.dataset.act === "commands-refresh") {
      busy("Recarregando…");
      const payload = await api("/api/panel/plugins/refresh", { method: "POST", body: {} });
      plugins = payload.plugins;
      usage = payload.usage ?? usage;
      builtins = builtins === null ? null : (await api(`/api/panel/commands?guild=${encodeURIComponent(state.guild ?? "")}`)).modules ?? builtins;
      toast(plural(payload.plugins.filter((p) => p.loaded).length, "plugin carregado", "plugins carregados"));
      render();
    } else if (act.dataset.act === "plugins-deploy-all" || act.dataset.act === "plugins-deploy") {
      busy("Publicando…");
      const payload = await api("/api/panel/plugins/deploy/all", { method: "POST", body: {} });
      plugins = payload.plugins;
      usage = payload.usage ?? usage;
      toast(`${plural(payload.commands, "comando publicado", "comandos publicados")} em ${payload.guild}`);
      render();
    } else if (act.dataset.act === "plugin-deploy") {
      busy("Publicando…");
      const payload = await api(`/api/panel/plugins/${encodeURIComponent(id)}/deploy`, { method: "POST", body: {} });
      plugins = payload.plugins;
      toast(`${id}: ${plural(payload.plugin ?? 0, "comando publicado", "comandos publicados")}, o resto foi mantido`);
      render();
    } else if (act.dataset.act === "cmd-toggle") {
      const cmd = act.dataset.cmd;
      const on = act.dataset.next === "1";
      act.disabled = true;
      const scope = act.dataset.scope;
      const query = `?guild=${encodeURIComponent(state.guild ?? "")}`;
      const path = scope === "builtin" ? `/api/panel/commands${query}` : `/api/panel/plugins/${encodeURIComponent(scope)}/commands${query}`;
      const payload = await api(path, { method: "PUT", body: { commands: [cmd], enabled: on } });
      if (payload.modules) builtins = payload.modules;
      if (payload.plugins) plugins = payload.plugins;
      if (payload.usage !== undefined) usage = payload.usage;
      toast(`/${cmd} ${on ? "ligado" : "desligado"}${on ? "" : " — sai da próxima publicação"}`);
      render();
    } else if (act.dataset.act === "plugin-toggle") {
      const next = act.dataset.next === "1";
      busy(next ? "Ativando…" : "Inativando…");
      applyPlugins(await api(`/api/panel/plugins/${encodeURIComponent(id)}`, { method: "PUT", body: { enabled: next } }));
      toast(`${id}: ${next ? "ativado" : "inativado"}${next ? "" : " — os comandos saem na próxima publicação"}`);
    } else if (act.dataset.act === "plugin-perm") {
      const plugin = (plugins ?? []).find((p) => p.id === id);
      if (!plugin) return;
      const on = act.checked;
      const next = on ? [...new Set([...plugin.permissions, act.dataset.perm])] : plugin.permissions.filter((p) => p !== act.dataset.perm);
      applyPlugins(await api(`/api/panel/plugins/${encodeURIComponent(id)}`, { method: "PUT", body: { permissions: next } }));
      toast(`${id}: ${on ? "ganhou" : "perdeu"} ${act.dataset.perm}`);
    } else if (act.dataset.act === "settings-save") {
      busy("Salvando…");
      // Only send what changed: a masked secret left untouched must not be erased with "".
      const body = {};
      for (const input of $$("[data-setting]")) {
        const field = settings.fields.find((f) => f.key === input.dataset.setting);
        if (field && input.value === (field.value ?? "")) continue;
        body[input.dataset.setting] = input.value.trim();
      }
      if (!Object.keys(body).length) { render(); return toast("Nada mudou."); }
      settings = await api("/api/panel/settings", { method: "PUT", body });
      render();
      toast("Salvo. Reinicie o bot para aplicar o que é lido na inicialização.", true);
    } else if (act.dataset.act === "settings-restart") {
      if (!confirm("Reiniciar o bot agora? A sessão do painel cai.")) return;
      busy("Reiniciando…");
      const payload = await api("/api/panel/settings", { method: "POST", body: { action: "restart" } });
      toast(payload.restarted ? "Reiniciando — volte em alguns segundos" : "Este ambiente não deixa o painel reiniciar o processo", !payload.restarted);
      button.disabled = false;
      button.textContent = "Reiniciar o bot";
    } else if (act.dataset.act === "password-save") {
      const current = $("#pw-current").value;
      const password = $("#pw-next").value;
      if (password.length < 8) return toast("A senha nova precisa de 8 caracteres ou mais", true);
      busy("Trocando…");
      await api("/api/panel/auth/password", { method: "POST", body: { current, password } });
      toast("Senha trocada. Entre de novo com a senha nova.");
      showLogin("Senha trocada. Entre de novo com a senha nova.");
    }
  } catch (err) {
    toast(`Falhou: ${err.message}`, true);
    if (button.isConnected) { button.disabled = false; render(); }
  }
}

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) return navigate(go.dataset.go);
  const act = e.target.closest("[data-act]");
  if (!act) return;
  if (act.dataset.act === "theme") {
    document.documentElement.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch {}
    return render();
  }
  if (act.dataset.act === "logout") {
    return api("/api/panel/auth/logout", { method: "POST", body: {} })
      .catch(() => null)
      .then(() => showLogin("Você saiu."));
  }
  if (/^plugin|^plugins|^cmd-toggle|^commands-|^settings|^password/.test(act.dataset.act ?? "")) {
    e.preventDefault();
    return pluginAction(act);
  }
});

document.addEventListener("change", async (e) => {
  const input = e.target.closest('[data-act="plugin-hosts"]');
  if (!input) return;
  const id = input.dataset.id;
  const hosts = input.value.split(",").map((h) => h.trim()).filter(Boolean);
  try {
    applyPlugins(await api(`/api/panel/plugins/${encodeURIComponent(id)}`, { method: "PUT", body: { allowedHosts: hosts } }));
    toast(`${id}: ${plural(hosts.length, "host liberado", "hosts liberados")}`);
  } catch (err) {
    toast(`Falhou: ${err.message}`, true);
  }
});

document.addEventListener("submit", async (e) => {
  if (e.target.id !== "auth-form") return;
  e.preventDefault();
  const button = e.target.querySelector("button");
  const password = $("#auth-password").value;
  button.disabled = true;
  button.textContent = "Entrando…";
  try {
    await api("/api/panel/auth/login", { method: "POST", body: { password } });
    await boot();
  } catch (err) {
    state.login = false;
    showLogin(`Não entrou: ${err.message}`);
  }
});

boot();
setInterval(async () => {
  if (!meta || !state.guild || state.view === "settings") return;
  try {
    meta = await api("/api/panel/guilds");
    await loadGuild();
    paintHead();
  } catch { /* mantém a última leitura */ }
}, 15000);
</script>
</body>
</html>
