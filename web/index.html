const LANGS = [["pt", "Português"], ["en", "English"], ["zh", "中文"]];
const storedLang = (() => { try { return localStorage.getItem("lang") || ""; } catch { return ""; } })();
const browserLang = () => {
  const l = (navigator.language || "pt").toLowerCase();
  if (l.startsWith("pt")) return "pt";
  if (l.startsWith("zh")) return "zh";
  return "en";
};

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = (name) => {
  const words = (name || "?").trim().split(/[\s-]+/).filter(Boolean);
  return (words.length > 1 ? words.slice(0, 2).map((w) => w[0]) : [words[0]?.slice(0, 2) ?? "?"]).join("").toUpperCase();
};

const storedTheme = (() => { try { return localStorage.getItem("theme") || ""; } catch { return ""; } })();
if (storedTheme) document.documentElement.dataset.theme = storedTheme;
const isDark = () => (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";

let state = { view: "overview", guild: null, toastT: null, off: false, auth: null, loginMessage: "", lang: storedLang || browserLang() };
let meta = null;
let data = null;
let plugins = null;
let pluginError = null;
let builtins = null;
let usage = null;
let settings = null;
let access = null;

  unknown_route: "err.unknownRoute", unknown_guild: "err.unknownGuild", no_guild: "err.noGuild",
  method_not_allowed: "err.method", unauthorized: "err.unauthorized", disabled: "err.disabled",
  body_too_large: "err.tooLarge", wasm_missing: "err.wasmMissing",

  plugin_removal_is_a_repository_edit: "err.removeInRepo", "read-only setting": "err.readOnlySetting",
};
const describeError = (raw) => {
  const text = String(raw ?? "");
  const [code, ...rest] = text.split(": ");
  const key = ERR[code];
  if (!key) return text;
  const detail = rest.join(": ");
  return detail ? `${t(key)}: ${detail}` : t(key);
};

const t = (key, vars) => {
  const raw = DICT[state.lang]?.[key] ?? DICT.pt[key] ?? key;
  return vars ? raw.replace(/\{(\w+)\}/g, (_, k) => String(vars[k] ?? "")) : raw;
};
const locale = () => (state.lang === "pt" ? "pt-BR" : state.lang === "zh" ? "zh-CN" : "en-US");
// Every panel read that returns translated text takes the locale, so names match the UI language.
const guildQuery = () => `?guild=${encodeURIComponent(state.guild ?? "")}&locale=${state.lang}`;
const nf = (n) => Number(n ?? 0).toLocaleString(locale());
const pl = (n, one, many) => `${nf(n)} ${t(n === 1 ? one : many)}`;

function setLang(next) {
  if (next === state.lang) return;
  state.lang = next;
  document.documentElement.lang = next === "pt" ? "pt-BR" : next === "zh" ? "zh-CN" : "en";
  try { localStorage.setItem("lang", next); } catch {}
  // Command names and descriptions come translated from the server, so drop the caches.
  builtins = null;
  plugins = null;
  paintChrome();
  if (!meta) return showLogin(state.loginMessage);
  $("#view").innerHTML = skeletonFor(state.view);
  render();
}

function toast(msg, bad) {
  const el = $("#toast");
  el.innerHTML = `<span class="${bad ? "r" : "g"}">${icon(bad ? "about" : "check", 13)}</span>${esc(msg)}`;
  el.className = `toast on${bad ? " bad" : ""}`;
  clearTimeout(state.toastT);
  state.toastT = setTimeout(() => (el.className = "toast"), 3200);
}

async function api(path, init) {
  const res = await fetch(path, {
    method: init?.method ?? "GET",
    credentials: "same-origin",
    headers: { ...(init?.body !== undefined && { "content-type": "application/json" }) },
    ...(init?.body !== undefined && { body: JSON.stringify(init.body) }),
  });
  const payload = await res.json().catch(() => null);
  if (res.status === 401) { showLogin(t("login.expired")); throw new Error(t("login.expired")); }
  if (!res.ok) throw new Error(payload?.error ? describeError(payload.error) : (res.status === 503 ? t("login.off") : `HTTP ${res.status}`));
  return payload;
}

  if (!series.length) return "";
  const max = Math.max(1, ...series.map((d) => d.total));
  const w = 100 / series.length;
  return `<div class="spark" style="height:${height}px" role="img" aria-label="${esc(t("usage.aria"))}">${series
    .map((d, i) => `<i style="left:${(i * w).toFixed(3)}%;width:${w.toFixed(3)}%;height:${Math.max(2, (d.total / max) * 100).toFixed(1)}%" title="${esc(d.day)}: ${nf(d.total)}"><span>${nf(d.total)}</span></i>`)
    .join("")}</div>`;
}

};

const moduleLabel = (name) => {
  const row = MODULE_LABEL[name];
  const i = state.lang === "pt" ? 0 : state.lang === "zh" ? 2 : 1;
  if (!row) return [name.replace(/Module$/, ""), ""];
  return [row[i], row[i + 3]];
};

function builtinCard(group) {
  const [label, hint] = moduleLabel(group.module);
  const off = group.commands.filter((c) => c.disabled).length;
  return `<section class="card plug">
  <div class="plug-head">
    <div class="tile">${esc(initials(label))}</div>
    <div class="plug-title">
      <div class="nm">${esc(label)}</div>
      <div class="path">${esc(hint)}</div>
    </div>
    <span class="stat"><i class="dot"></i>${esc(t("ps.builtin"))}</span>
    <div class="plug-actions">
      <span class="tag code" title="${esc(t("plug.usesTitle"))}">${pl(group.uses, "unit.use1", "unit.useN")}</span>
      ${off ? `<span class="tag">${esc(t("plug.offN", { n: off }))}</span>` : ""}
    </div>
  </div>
  <div class="plug-sec">
    <div class="sec">${esc(t("cmd.commands"))}</div>
    <ul class="cmds">${group.commands.map((cmd) => cmdRow(cmd, "builtin")).join("")}</ul>
  </div>
</section>`;
}

function builtinsBody() {
  if (builtins === null) return `<div class="plug-list">${skCardH("220px")}${skCardH("180px")}</div>`;
  if (!builtins.length) return `<section class="card">${emptyRow(t("cm.empty"))}</section>`;
  return `<div class="plug-list">${builtins.map(builtinCard).join("")}</div>`;
}

function viewCommands() {
  const total = (builtins ?? []).reduce((n, g) => n + g.commands.length, 0);
  const off = (builtins ?? []).reduce((n, g) => n + g.commands.filter((c) => c.disabled).length, 0);
  const head = pageHead(
    t("cm.title"),
    esc(t("cm.lede")),
    `<button class="btn" data-act="commands-refresh">${esc(t("btn.reload"))}</button><button class="btn" data-act="plugins-deploy-all">${esc(t("btn.publishAll"))}</button>`,
  );
  const meta = `<div class="metrics" style="margin-bottom:12px">
    ${metric(t("cm.metric.commands"), nf(total), esc(t("cm.metric.in", { n: pl((builtins ?? []).length, "unit.module1", "unit.moduleN") })))}
    ${metric(t("cm.metric.off"), nf(off), esc(off ? t("cm.metric.leave") : t("cm.metric.allOn")))}
  </div>`;
  return shell(head, meta + usageCard(usage) + builtinsBody());
}

function viewPlugins() {
  const list = plugins ?? [];
  const head = pageHead(
    t("pl.title"),
    esc(t("pl.lede")),
    `<button class="btn" data-act="plugins-refresh">${esc(t("btn.reload"))}</button><button class="btn" data-act="plugins-deploy-all">${esc(t("btn.publishAll"))}</button>`,
  );
  if (pluginError) return shell(head, `<section class="card pad"><div class="stat err"><i class="dot"></i>${esc(pluginError)}</div></section>`);
  const body = `${usageCard(usage)}
  ${list.length ? `<div class="plug-list">${list.map(pluginCard).join("")}</div>` : `<section class="card">${emptyRow(t("pl.empty"))}</section>`}
  <section class="card pad" style="margin-top:12px">
    <div class="sec-title">${esc(t("pl.install.title"))}</div>
    <div class="hint" style="margin:0">${esc(t("pl.install.body"))}</div>
  </section>`;
  return shell(head, body);
}

async function loadPlugins() {
  try {
    const payload = await api(`/api/panel/plugins${guildQuery()}`);
    plugins = payload.plugins;
    usage = payload.usage;
    pluginError = null;
  } catch (err) {
    pluginError = t("pl.error", { m: err.message });
  }
}

async function loadBuiltins() {
  try {
    const payload = await api(`/api/panel/commands${guildQuery()}`);
    builtins = payload.modules ?? [];
    if (!usage) {
      const report = await api(`/api/panel/usage${guildQuery()}`).catch(() => null);
      usage = report ?? null;
    }
  } catch {
    builtins = [];
  }
  render();
}

function applyPlugins(payload) {
  if (payload?.plugins) plugins = payload.plugins;
  if (payload?.usage !== undefined) usage = payload.usage;
  pluginError = null;
  render();
}

function viewSettings() {
  const head = pageHead(t("set.title"), esc(t("set.lede")), "");
  if (!settings) return shell(head, `<section class="card">${emptyRow(t("set.loading"))}</section>`);
  const rows = settings.fields.map((f) => {
    const label = f.writable
      ? f.value === null ? t("set.empty") : f.active ? t("set.active") : t("set.saved")
      : t("set.readOnly");
    const cls = f.writable ? (f.value === null ? "" : f.active ? "ok" : "warn") : "";
    return `<div class="set-row">
    <div class="set-label">
      <div class="nm">${esc(t("set.k." + f.key))}</div>
      <div class="hint">${esc(t("set.h." + f.key))}</div>
    </div>
    <div class="set-input">
      <input data-setting="${esc(f.key)}" type="${f.secret ? "password" : "text"}" autocomplete="off" spellcheck="false"
        value="${esc(f.value ?? "")}" placeholder="${f.secret ? esc(t("set.notSet")) : ""}" ${f.writable ? "" : "disabled"}>
      <span class="stat ${cls}" title="${esc(!f.writable ? t("set.readOnlyHint") : f.restart && f.value !== null ? t("set.restartTitle") : "")}"><i class="dot"></i>${esc(label)}</span>
    </div>
  </div>`;
  }).join("");
  const actions = `<section class="card pad" style="margin-top:12px">
    <div class="sec-title">${esc(t("set.apply.title"))}</div>
    <div class="hint" style="margin-bottom:10px">${esc(t("set.apply.hint"))}</div>
    <div class="actions"><button class="btn pri" data-act="settings-save">${esc(t("btn.save"))}</button><button class="btn" data-act="settings-restart">${esc(t("btn.restart"))}</button></div>
  </section>`;
  return shell(head, `<section class="card">${rows}</section>${accessCard()}${actions}`);
}

/* Allowlist: the one setting that takes effect without a restart, so it gets its own card. */
function accessCard() {
  if (access === null) return `<section class="card pad" style="margin-top:12px">${sk("220px", 11)}</section>`;
  const me = state.auth?.user?.email?.toLowerCase() ?? "";
  const rows = access.map((email) => `<div class="row-item">
    <div class="row-main"><div class="name mono">${esc(email)}${email === me ? ` <span class="tag acc">${esc(t("access.you"))}</span>` : ""}</div></div>
    <div class="row-end"><button class="btn sm" data-act="access-del" data-email="${esc(email)}" ${access.length <= 1 ? `disabled title="${esc(t("access.only"))}"` : ""}>${esc(t("access.remove"))}</button></div>
  </div>`).join("");
  return `<section class="card" style="margin-top:12px">
    <div class="card-h"><h2>${esc(t("access.title"))}</h2><span class="sub">${pl(access.length, "unit.person1", "unit.personN")}</span></div>
    <div class="rows">${rows || emptyRow(t("access.empty"))}</div>
    <div class="pad" style="border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input class="grow" id="access-email" type="email" autocomplete="off" spellcheck="false" placeholder="${esc(t("access.placeholder"))}">
      <button class="btn pri" data-act="access-add">${esc(t("access.add"))}</button>
    </div>
    <div class="pad" style="padding-top:0"><div class="hint" style="margin:0">${esc(t("access.hint"))}</div></div>
  </section>`;
}

async function loadSettings() {
  try {
    settings = await api("/api/panel/settings");
  } catch (err) {
    settings = { fields: [], error: err.message };
  }
  access = await api("/api/panel/auth/access").then((r) => r.emails).catch(() => []);
}

/* Both actions write the whole list, so the server never has to guess what to merge. */
async function saveAccess(next) {
  const payload = await api("/api/panel/auth/access", { method: "PUT", body: { emails: next } });
  access = payload.emails;
  if (state.auth) state.auth.allowlist = access.length;
  render();
}

function viewAbout() {
  const head = pageHead(t("ab.title"), esc(t("ab.lede")));
  const steps = [1, 2, 3, 4, 5, 6].map((n) => [t(`ab.s${n}.t`), t(`ab.s${n}.d`)]);
  const list = `<section class="card">
    <div class="card-h"><h2>${esc(t("ab.steps.title"))}</h2></div>
    <div class="rows">${steps.map(([title, desc], i) => `<div class="row-item" style="align-items:flex-start">
      <div class="tile">${i + 1}</div>
      <div class="row-main"><div class="name">${esc(title)}</div><div class="desc wrap">${esc(desc)}</div></div>
    </div>`).join("")}</div>
  </section>`;
  const env = `<section class="card pad">
    <div class="sec-title">${esc(t("ab.env.title"))}</div>
    <dl class="dl">
      <dt>${esc(t("ab.env.bot"))}</dt><dd>${esc(meta?.bot?.tag ?? "—")}</dd>
      <dt>${esc(t("ab.env.gateway"))}</dt><dd>${meta?.ping == null ? "—" : `${meta.ping} ms`}</dd>
      <dt>${esc(t("ab.env.guilds"))}</dt><dd>${nf(meta?.guilds?.length ?? 0)}</dd>
      <dt>${esc(t("ab.env.plugins"))}</dt><dd>${nf((plugins ?? []).filter((p) => p.loaded).length)} / ${nf(plugins?.length ?? meta?.plugins?.length ?? 0)}</dd>
      <dt>${esc(t("ab.env.session"))}</dt><dd>${esc(meta?.session === "discord" ? t("ab.env.sessionDiscord") : t("ab.env.sessionToken"))}</dd>
    </dl>
  </section>`;
  const caveat = `<section class="card pad">
    <div class="sec-title">${esc(t("ab.write.title"))}</div>
    <div class="callout">${esc(t("ab.write.body"))}</div>
  </section>`;
  return shell(head, `<div class="cols"><div class="stack">${list}</div><div class="stack">${env}${caveat}</div></div>`);
}

/* Rótulos fixos do chrome: nav, rodapé, marca. */
function paintChrome() {
  $("#brand-tag").textContent = t("brand.tag");
  $("#nav-g1").textContent = t("nav.server");
  $("#nav-overview").textContent = t("nav.overview");
  $("#nav-g2").textContent = t("nav.platform");
  $("#nav-plugins-lbl").textContent = t("nav.plugins");
  $("#nav-commands-lbl").textContent = t("nav.commands");
  $("#nav-settings").textContent = t("nav.settings");
  $("#nav-about").textContent = t("nav.about");
  $("#foot-gateway").textContent = t("foot.gateway");
  $("#foot-guilds-lbl").textContent = t("foot.guilds");
  $("#foot-active-lbl").textContent = t("foot.active");
  $("#foot-out-lbl").textContent = t("foot.logout");
}

function paintHead() {
  $("#brandmark").innerHTML = icon("brand", 13);
  $$(".nav a").forEach((b) => {
    b.classList.toggle("on", b.dataset.go === state.view);
    const ico = b.querySelector(".ic");
    if (ico && !ico.childElementCount) ico.innerHTML = icon(b.dataset.go, 13);
  });
  const out = $(".foot-out .ic");
  if (out && !out.childElementCount) out.innerHTML = icon("out", 13);
  $("#nav-plugins").textContent = nf(plugins?.length ?? meta?.plugins?.length ?? 0);
  $("#nav-commands").textContent = nf((builtins ?? []).reduce((n, g) => n + g.commands.length, 0));
  $("#foot-guilds").textContent = nf(meta?.guilds?.length ?? 0);
  $("#foot-ping").textContent = meta?.ping == null ? "—" : `${meta.ping} ms`;
  $("#foot-active").textContent = nf((plugins ?? []).filter((p) => p.loaded).length);
}

function render() {
  const v = state.view;
  if (v === "plugins" && plugins === null) { loadPlugins().then(render); return; }
  if (v === "commands" && builtins === null) { loadBuiltins(); return; }
  if (v === "settings" && settings === null) { loadSettings().then(render); return; }
  let html;
  if (v === "plugins") html = viewPlugins();
  else if (v === "commands") html = viewCommands();
  else if (v === "settings") html = viewSettings();
  else if (v === "about") html = viewAbout();
  else html = viewOverview();
  $("#view").innerHTML = html;
  paintHead();
}

let navToken = 0;
function navigate(next) {
  const tokenId = ++navToken;
  state.view = next;
  $("#view").innerHTML = skeletonFor(next);
  paintHead();
  $("main").scrollTop = 0;
  setTimeout(() => { if (tokenId === navToken) render(); }, 320);
}

/* Sem senha: o botão manda o navegador para o Discord pelo Better Auth. */
function showLogin(message) {
  state.loginMessage = message;
  meta = null; data = null; plugins = null; builtins = null; settings = null; access = null;
  const ready = Boolean(state.auth?.ready);
  const hint = !state.auth ? "" : !state.auth.secret ? t("login.nosecret") : !state.auth.discord ? t("login.unconfigured") : !state.auth.allowlist ? t("login.noallow") : "";
  $("#view").innerHTML = `<div class="auth"><div class="auth-card">
    <div class="auth-mark">${icon("brand", 16)}</div>
    <h1>${esc(t("login.title"))}</h1>
    <p>${esc(message || t("login.sub"))}${hint ? ` ${esc(hint)}` : ""}</p>
    <button class="btn pri lg" data-act="discord"${ready ? "" : " disabled"}>${esc(t("login.discord"))}</button>
    ${langSelect()}
  </div></div>`;
  document.body.classList.add("auth-mode");
  paintChrome();
}

const clearAuthMode = () => document.body.classList.remove("auth-mode");

async function signIn(button) {
  button.disabled = true;
  const label = button.textContent;
  button.textContent = t("login.enter");
  try {
    const res = await fetch("/api/auth/sign-in/social", {
      method: "POST",
      credentials: "same-origin",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ provider: "discord", callbackURL: location.origin + "/", disableRedirect: true }),
    });
    const payload = await res.json().catch(() => null);
    if (payload?.url) return void (location.href = payload.url);
    throw new Error(payload?.message ?? (payload?.error ? describeError(payload.error) : `HTTP ${res.status}`));
  } catch (err) {
    button.disabled = false;
    button.textContent = label;
    toast(t("login.failed", { m: err.message }), true);
  }
}

async function boot() {
  const params = new URLSearchParams(location.search);
  if (params.get("error")) history.replaceState(null, "", "/");
  let status = null;
  try {
    status = await api("/api/panel/auth/status");
  } catch (err) {
    state.off = err.message === t("login.off");
    return showLogin(t("login.error", { m: err.message }));
  }
  state.auth = status;
  if (!status.authenticated) {
    return showLogin(params.get("error") ? t("login.denied") : "");
  }
  try {
    meta = await api("/api/panel/guilds");
  } catch (err) {
    return showLogin(t("login.error", { m: err.message }));
  }
  meta.session = status.user ? "discord" : "token";
  state.guild = meta.guilds[0]?.id ?? null;
  if (!state.guild) {
    $("#view").innerHTML = shell(pageHead(t("nogs.title"), esc(t("nogs.lede"))), "");
    clearAuthMode();
    paintChrome();
    paintHead();
    return;
  }
  await loadGuild();
  clearAuthMode();
  render();
}

async function loadGuild() {
  data = await api(`/api/panel?guild=${encodeURIComponent(state.guild)}`);
}

async function pluginAction(act) {
  const id = act.dataset.id;
  const button = act;
  const busy = (label) => { button.disabled = true; button.textContent = label; };
  try {
    if (act.dataset.act === "plugins-refresh" || act.dataset.act === "commands-refresh") {
      busy("…");
      const payload = await api(`/api/panel/plugins/refresh${guildQuery()}`, { method: "POST", body: {} });
      plugins = payload.plugins;
      usage = payload.usage ?? usage;
      builtins = builtins === null ? null : (await api(`/api/panel/commands${guildQuery()}`)).modules ?? builtins;
      toast(t("toast.reloaded", { n: pl(payload.plugins.filter((p) => p.loaded).length, "unit.plugin1", "unit.pluginN") }));
      render();
    } else if (act.dataset.act === "plugins-deploy-all" || act.dataset.act === "plugins-deploy") {
      busy("…");
      const payload = await api(`/api/panel/plugins/deploy/all${guildQuery()}`, { method: "POST", body: {} });
      plugins = payload.plugins;
      usage = payload.usage ?? usage;
      toast(t("toast.published", { n: pl(payload.commands, "unit.published1", "unit.publishedN"), guild: payload.guild }));
      render();
    } else if (act.dataset.act === "plugin-deploy") {
      busy("…");
      const payload = await api(`/api/panel/plugins/${encodeURIComponent(id)}/deploy${guildQuery()}`, { method: "POST", body: {} });
      plugins = payload.plugins;
      toast(t("toast.pluginPublished", { id, n: pl(payload.plugin ?? 0, "unit.published1", "unit.publishedN") }));
      render();
    } else if (act.dataset.act === "cmd-toggle") {
      const cmd = act.dataset.cmd;
      const on = act.dataset.next === "1";
      act.disabled = true;
      const scope = act.dataset.scope;
      const query = guildQuery();
      const path = scope === "builtin" ? `/api/panel/commands${query}` : `/api/panel/plugins/${encodeURIComponent(scope)}/commands${query}`;
      const payload = await api(path, { method: "PUT", body: { commands: [cmd], enabled: on } });
      if (payload.modules) builtins = payload.modules;
      if (payload.plugins) plugins = payload.plugins;
      if (payload.usage !== undefined) usage = payload.usage;
      toast(on ? t("toast.cmdOn", { c: cmd }) : t("toast.cmdOff", { c: cmd }));
      render();
    } else if (act.dataset.act === "plugin-toggle") {
      const next = act.dataset.next === "1";
      busy("…");
      applyPlugins(await api(`/api/panel/plugins/${encodeURIComponent(id)}${guildQuery()}`, { method: "PUT", body: { enabled: next } }));
      toast(next ? t("toast.plugOn", { id }) : t("toast.plugOff", { id }));
    } else if (act.dataset.act === "settings-save") {
      busy("…");
      // Only send what changed: a masked secret left untouched must not be erased with "".
      const body = {};
      for (const input of $$("[data-setting]")) {
        const field = settings.fields.find((f) => f.key === input.dataset.setting);
        if (field && input.value === (field.value ?? "")) continue;
        body[input.dataset.setting] = input.value.trim();
      }
      if (!Object.keys(body).length) { render(); return toast(t("toast.nothing")); }
      settings = await api("/api/panel/settings", { method: "PUT", body });
      render();
      toast(t("toast.saved"), true);
    } else if (act.dataset.act === "access-add") {
      const input = $("#access-email");
      const email = (input?.value ?? "").trim().toLowerCase();
      if (!email) return;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast(t("access.bad", { e: email }), true);
      if (access.includes(email)) return toast(t("access.dupe"), true);
      await saveAccess([...access, email]);
      toast(t("toast.accessAdd", { e: email }));
    } else if (act.dataset.act === "access-del") {
      const email = act.dataset.email;
      await saveAccess(access.filter((e) => e !== email));
      toast(t("toast.accessDel", { e: email }));
    } else if (act.dataset.act === "settings-restart") {
      if (!confirm(t("confirm.restart"))) return;
      busy("…");
      const payload = await api("/api/panel/settings", { method: "POST", body: { action: "restart" } });
      toast(payload.restarted ? t("toast.restarting") : t("toast.noRestart"), !payload.restarted);
      button.disabled = false;
      button.textContent = t("btn.restart");
    }
  } catch (err) {
    toast(t("toast.fail", { m: err.message }), true);
    if (button.isConnected) { button.disabled = false; render(); }
  }
}

document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]");
  if (go) return navigate(go.dataset.go);
  const act = e.target.closest("[data-act]");
  if (!act) return;
  if (act.dataset.act === "theme") {
    document.documentElement.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch {}
    return render();
  }
  if (act.dataset.act === "discord") {
    e.preventDefault();
    return signIn(act);
  }
  if (act.dataset.act === "logout") {
    return api("/api/panel/auth/logout", { method: "POST", body: {} })
      .catch(() => null)
      .then(() => showLogin(t("login.leaving")));
  }
  if (/^plugin|^plugins|^cmd-toggle|^commands-|^settings|^access-/.test(act.dataset.act ?? "")) {
    e.preventDefault();
    return pluginAction(act);
  }
});

document.addEventListener("change", async (e) => {
  const lang = e.target.closest('[data-act="lang"]');
  if (lang) return setLang(lang.value);
});

paintChrome();
boot();
setInterval(async () => {
  if (!meta || !state.guild || state.view === "settings") return;
  try {
    meta = await api("/api/panel/guilds");
    meta.session = meta.session ?? (state.auth?.user ? "discord" : "token");
    await loadGuild();
    paintHead();
  } catch { /* mantém a última leitura */ }
}, 15000);
</script>
