name: ci

# Testes do bot, no PR e na `main`.
#
# ## Por que `ubuntu-latest` e não o runner do cluster
#
# O repositório é público: um PR de fork executa código de estranho. Num runner
# self-hosted isso significa código de terceiro com o `config.json` do registry
# montado e o daemon do cluster ao lado — não é um risco teórico. Runner do
# GitHub não tem credencial nenhuma, e em repositório público ele é de graça.
#
# O build da imagem é outro workflow (`image.yml`), que só roda na `main` e só
# DEPOIS que este passa: ele escuta `workflow_run` deste workflow, não o `push`.
#
# Este workflow roda em `pull_request` E em `push: main`, de propósito. O de PR
# é o que pega o defeito antes do merge; o de push na `main` é o que serve de
# gatilho para o build — sem ele, um merge direto (ou um commit sem PR) não
# testaria nada e o `image.yml` não teria um `workflow_run` para esperar.
#
# ## Por que só o Postgres, e não o `docker compose` inteiro
#
# `panel:check` forja sessões no banco e prova a allowlist pelo HTTP; ele nunca
# fala com o S3. O `config` valida o ambiente todo no import, então as chaves do
# S3 entram como valor qualquer — é o mesmo motivo do workflow antigo.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: roboteco
          POSTGRES_PASSWORD: roboteco
          POSTGRES_DB: roboteco
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roboteco -d roboteco"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The plugin tests count calls through the cache (kv increments, the XP
      # window, the DM rate limit), so a missing Valkey makes them crash with
      # ECONNREFUSED, not fail on the assertion. Same image and flags as
      # compose.prod.yaml, minus persistence: a rate limit does not need a disk.
      valkey:
        image: valkey/valkey:9.2.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # `src/config.ts` valida o ambiente INTEIRO no import: até o migrator
      # precisa destas chaves para não morrer em "DISCORD_TOKEN is required"
      # antes de tocar no banco.
      DISCORD_TOKEN: x
      DISCORD_CLIENT_ID: x
      DATABASE_URL: postgres://roboteco:roboteco@localhost:5432/roboteco
      S3_ENDPOINT: http://localhost:3900
      S3_ACCESS_KEY_ID: x
      S3_SECRET_ACCESS_KEY: x
      S3_BUCKET: roboteco
    steps:
      - uses: actions/checkout@v4

      # Toolchain from `mise.toml` and `rust-toolchain.toml`: the same Node,
      # pnpm, Rust and Go a contributor gets locally, so "it builds" means the
      # same thing in CI and on a laptop. First step because it provides pnpm.
      - uses: jdx/mise-action@v2

      # `cache: pnpm` reads pnpm's store path, so pnpm must already exist —
      # mise installed it above.
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Banco vazio, migração do zero: é o caminho que um deploy novo percorre.
      # O `initContainer` de produção roda exatamente este script.
      - name: Migrate
        run: pnpm db:migrate:runtime

      - name: Panel boundary
        run: pnpm panel:check

      # Plugins are Rust/Go source (plugins/dist is gitignored), and the test
      # suite loads built WASM — `tests/plugins/*` fails with "run pnpm
      # plugins:build first". The image build compiles the same sources, so
      # this step is also what catches a plugin that stops compiling, before
      # it reaches a registry the bot reads.
      #
      # `rustup target add` is not redundant with rust-toolchain.toml: mise
      # exports RUSTUP_TOOLCHAIN, which takes precedence over that file, so
      # rustup never sees `targets = ["wasm32-unknown-unknown"]` and the build
      # dies with "can't find crate for `std`".
      - name: Tests
        run: |
          rustup target add wasm32-unknown-unknown
          pnpm plugins:build
          pnpm test

